name: Build Windows desktop pet
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Sprout-Windows
          path: release/Sprout-1.0.0-Windows.exe
          if-no-files-found: error

